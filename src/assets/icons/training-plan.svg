<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Календарь/план тренировок -->
  <!-- Основа календаря -->
  <rect x="16" y="18" width="32" height="32" rx="3" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Крепления сверху -->
  <line x1="24" y1="14" x2="24" y2="22" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="14" x2="40" y2="22" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Шапка календаря -->
  <line x1="16" y1="26" x2="48" y2="26" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2" stroke-linecap="round"/>

  <!-- Сетка дней (4x3) -->
  <!-- Вертикальные линии -->
  <line x1="24" y1="26" x2="24" y2="50" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="26" x2="32" y2="50" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="26" x2="40" y2="50" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2" stroke-linecap="round"/>

  <!-- Горизонтальные линии -->
  <line x1="16" y1="34" x2="48" y2="34" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="42" x2="48" y2="42" stroke="rgba(232, 212, 200, 0.85)" stroke-width="2" stroke-linecap="round"/>

  <!-- Отметки на важных днях -->
  <circle cx="20" cy="30" r="1.5" fill="rgba(232, 212, 200, 0.85)"/>
  <circle cx="36" cy="38" r="1.5" fill="rgba(232, 212, 200, 0.85)"/>
  <circle cx="28" cy="46" r="1.5" fill="rgba(232, 212, 200, 0.85)"/>
</svg>
